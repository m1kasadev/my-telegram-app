```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Часть чего-то большего</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
        }

        .screen {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow: hidden;
        }

        /* Капля */
        .drop {
            position: absolute;

            top: -80px;
            left: 50%;

            width: 38px;
            height: 55px;

            background: #9e0000;
            border-radius: 50% 50% 55% 55%;

            transform: translateX(-50%);

            filter: drop-shadow(0 0 12px rgba(150, 0, 0, 0.5));

            animation: fall 3s ease-in forwards;
        }

        /* След за каплей */
        .trail {
            position: absolute;

            top: 0;
            left: 50%;

            width: 5px;
            height: 0;

            background: #760000;

            transform: translateX(-50%);

            animation: trail 3s ease-in forwards;
        }

        /* Текст */
        .text {
            opacity: 0;

            text-align: center;

            font-size: clamp(24px, 7vw, 42px);
            letter-spacing: 2px;

            transform: translateY(15px);

            animation: textAppear 2s ease forwards;
            animation-delay: 2.7s;
        }

        .text span {
            display: block;
            margin-top: 12px;

            font-size: 14px;
            letter-spacing: 5px;

            opacity: 0.5;
        }

        @keyframes fall {
            0% {
                top: -80px;
                transform: translateX(-50%) scale(0.7);
            }

            70% {
                top: 45%;
                transform: translateX(-50%) scale(1);
            }

            82% {
                top: 48%;
                transform: translateX(-50%) scale(1.15, 0.85);
            }

            100% {
                top: 48%;
                transform: translateX(-50%) scale(0);
            }
        }

        @keyframes trail {
            0% {
                height: 0;
            }

            70% {
                height: 48%;
            }

            100% {
                height: 48%;
                opacity: 0;
            }
        }

        @keyframes textAppear {
            0% {
                opacity: 0;
                transform: translateY(15px);
                letter-spacing: 8px;
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                letter-spacing: 2px;
            }
        }
    </style>
</head>

<body>

<div class="screen">

    <div class="trail"></div>

    <div class="drop"></div>

    <div class="text">
        часть чего-то большего
        <span>PART OF SOMETHING GREATER</span>
    </div>

</div>

</body>
</html>
```
